name: State Street
description: >-
  State Street Corporation is one of the world's largest financial services companies, headquartered in Boston,
  Massachusetts. Founded in 1792, State Street provides investment servicing, investment management, investment
  research, and trading services to institutional investors including mutual funds, collective investment funds,
  corporate and public retirement plans, insurance companies, foundations, and endowments. State Street manages
  approximately $4.7 trillion in assets under management through State Street Global Advisors and services nearly $40
  trillion in assets under custody. The company operates the State Street Alpha front-to-back investment management
  platform, Fund Connect for ETF creation and redemption, and Charles River Development for investment management
  technology. State Street's developer portal at developer.statestreet.com provides OAuth 2.0-secured APIs enabling
  institutional clients to programmatically access portfolio data, transaction history, NAV calculations, analytics, and
  ETF order management. APIs follow REST conventions with OpenAPI 3.0 specifications, JSON data format, and JSON Schema
  documentation.
apis:
- aid: state-street:investment-accounting-api
  name: Investment Accounting API
  description: >-
    The State Street Investment Accounting API provides institutional clients with access to portfolio
    accounting data including net asset value (NAV) calculations, position valuations, corporate actions
    processing, performance measurement, and attribution analysis. State Street services over 70 types
    of portfolios including mutual funds, insurance portfolios, alternatives, and pension funds.
  humanURL: https://www.statestreet.com/us/en/solutions/investment-accounting
  baseURL: https://api.statestreet.com/v1/accounting
  tags:
