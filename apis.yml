- aid: state-street:performance-analytics-api
  name: Performance Analytics API
  description: >-
    The State Street Performance Analytics API (TrueView) provides institutional investors and asset managers
    with access to investment risk analytics, performance attribution, scenario analysis, and reporting.
    Enables portfolio managers to access benchmark-relative attribution, risk factor decomposition, and
    regulatory reporting data across all asset classes including fixed income, equities, derivatives,
    and alternatives.
  humanURL: https://www.statestreet.com/us/en/asset-owner/solutions/performance-and-analytics
  baseURL: https://api.statestreet.com/v1/analytics
